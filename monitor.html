<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PoolGuard Monitor</title>
<style>
  :root {
    --bg: #0f172a; --card: #1e293b; --text: #e2e8f0; --muted: #94a3b8;
    --green: #22c55e; --red: #ef4444; --gray: #64748b; --blue: #38bdf8;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, sans-serif;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; padding: 24px 16px; gap: 20px;
  }
  h1 { font-size: 1.4rem; font-weight: 600; }
  .card {
    background: var(--card); border-radius: 16px; padding: 24px;
    width: 100%; max-width: 420px;
  }
  #statusCard { text-align: center; }
  #light {
    width: 90px; height: 90px; border-radius: 50%; margin: 8px auto 16px;
    background: var(--gray); transition: background .3s, box-shadow .3s;
  }
  #light.armed  { background: var(--green); box-shadow: 0 0 40px rgba(34,197,94,.45); }
  #light.alert  { background: var(--red);   box-shadow: 0 0 50px rgba(239,68,68,.65); animation: blink 1s infinite; }
  #light.offline{ background: var(--gray);  opacity: .4; }
  #light.loading {
    background: transparent;
    border: 7px solid var(--gray);
    border-top-color: var(--blue);
    animation: spin 1s linear infinite;
  }
  @keyframes blink { 50% { opacity: .35; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  #stateText { font-size: 1.25rem; font-weight: 700; letter-spacing: .5px; }
  #subText   { color: var(--muted); font-size: .85rem; margin-top: 4px; }
  .buttons { display: flex; gap: 12px; margin-top: 20px; }
  button {
    flex: 1; padding: 14px; border: 0; border-radius: 12px;
    font-size: 1rem; font-weight: 600; cursor: pointer; color: #fff;
    transition: transform .1s, opacity .2s;
  }
  button:active { transform: scale(.97); }
  button:disabled { opacity: .35; cursor: default; }
  #armBtn    { background: var(--green); }
  #disarmBtn { background: var(--red); }
  #powerBtn  { background: var(--gray); margin-top: 12px; width: 100%; }
  #powerBtn.on { background: var(--blue); }
  h2 { font-size: .95rem; color: var(--muted); font-weight: 600; margin-bottom: 12px; }
  #events { list-style: none; display: flex; flex-direction: column; gap: 10px; }
  #events li {
    display: flex; gap: 10px; align-items: baseline;
    font-size: .9rem; border-left: 3px solid var(--gray); padding-left: 10px;
  }
  #events li.alert     { border-color: var(--red); }
  #events li.alert_end { border-color: var(--blue); }
  #events li.arm       { border-color: var(--green); }
  #events li .ts { color: var(--muted); font-size: .78rem; white-space: nowrap; }
  #events li.empty { border: 0; color: var(--muted); }
</style>
</head>
<body>
  <h1>🏊 PoolGuard Monitor</h1>

  <div class="card" id="statusCard">
    <div id="light"></div>
    <div id="stateText">Connecting…</div>
    <div id="subText"></div>
    <div class="buttons">
      <button id="armBtn">🔒 Arm</button>
      <button id="disarmBtn">🔓 Disarm</button>
    </div>
    <button id="powerBtn">⏻ …</button>
  </div>

  <div class="card">
    <h2>Recent events</h2>
    <ul id="events"><li class="empty">Loading…</li></ul>
  </div>

<script>
const EMOJI = { alert: "🚨", alert_end: "✅", arm: "🔒", disarm: "🔓" };
const light = document.getElementById("light");
const stateText = document.getElementById("stateText");
const subText = document.getElementById("subText");
const armBtn = document.getElementById("armBtn");
const disarmBtn = document.getElementById("disarmBtn");
const powerBtn = document.getElementById("powerBtn");
let systemOn = null;   // etat courant, pilote le comportement du bouton ⏻
let pending = null;    // action en cours: {action: 'on'|'off'|'arm'|'disarm', since: ms}
const PENDING_LABELS = {
  on:     ["Starting system…", "Launching the video pipeline, a few seconds"],
  off:    ["Shutting down…", "Stopping surveillance cleanly"],
  arm:    ["Arming…", "Sending command to the system"],
  disarm: ["Disarming…", "Sending command to the system"],
};

function showPending() {
  light.className = "loading";
  stateText.textContent = "⏳ " + PENDING_LABELS[pending.action][0];
  subText.textContent = PENDING_LABELS[pending.action][1];
  armBtn.disabled = disarmBtn.disabled = powerBtn.disabled = true;
}

async function refreshStatus() {
  try {
    const s = await (await fetch("/api/status")).json();
    systemOn = s.service_running;

    // L'action en cours est-elle terminee ?
    if (pending) {
      const done =
        (pending.action === "on"     && s.online) ||
        (pending.action === "off"    && !s.service_running) ||
        (pending.action === "arm"    && s.armed === true) ||
        (pending.action === "disarm" && s.armed === false);
      if (done || Date.now() - pending.since > 60000) pending = null;  // 60s = garde-fou
      else { showPending(); return; }
    }

    powerBtn.disabled = false;
    if (!s.service_running) {
      light.className = "offline";
      stateText.textContent = "⛔ SYSTEM OFF";
      subText.textContent = "No surveillance, no recording";
      armBtn.disabled = disarmBtn.disabled = true;
      powerBtn.textContent = "⏻ Power on";
      powerBtn.className = "on";
      return;
    }
    powerBtn.textContent = "⏻ Power off";
    powerBtn.className = "";
    if (!s.online) {
      light.className = "loading";
      stateText.textContent = "⏳ STARTING…";
      subText.textContent = "Video pipeline is launching (a few seconds)";
      armBtn.disabled = disarmBtn.disabled = true;
      return;
    }
    armBtn.disabled = s.armed === true;
    disarmBtn.disabled = s.armed === false;
    if (s.alert) {
      light.className = "alert";
      stateText.textContent = "🚨 POOL ALERT";
      subText.textContent = "Person detected — recording in progress";
    } else if (s.armed) {
      light.className = "armed";
      stateText.textContent = "SYSTEM ARMED";
      subText.textContent = "Pool under surveillance";
    } else {
      light.className = "";
      stateText.textContent = "SYSTEM DISARMED";
      subText.textContent = "No alerts will be triggered";
    }
  } catch {
    light.className = "offline";
    stateText.textContent = "API UNREACHABLE";
    subText.textContent = "";
  }
}

async function refreshEvents() {
  try {
    const events = await (await fetch("/api/events")).json();
    const ul = document.getElementById("events");
    if (!events.length) {
      ul.innerHTML = '<li class="empty">No events yet</li>';
      return;
    }
    ul.innerHTML = events.map(e => {
      const d = new Date(e.ts * 1000);
      const ts = d.toLocaleDateString("en-GB", { day: "2-digit", month: "2-digit" })
               + " " + d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
      return `<li class="${e.kind}"><span class="ts">${ts}</span>` +
             `<span>${EMOJI[e.kind] || ""} ${e.message}</span></li>`;
    }).join("");
  } catch { /* silencieux : retente au prochain cycle */ }
}

function doAction(action, url) {
  pending = { action, since: Date.now() };
  showPending();
  fetch(url, { method: "POST" }).then(refreshStatus);
}
armBtn.onclick = () => doAction("arm", "/api/arm");
disarmBtn.onclick = () => doAction("disarm", "/api/disarm");
powerBtn.onclick = () => {
  if (systemOn && !confirm("Power off PoolGuard?\nNo surveillance or recording until powered back on.")) return;
  doAction(systemOn ? "off" : "on", systemOn ? "/api/power/off" : "/api/power/on");
};

refreshStatus(); refreshEvents();
setInterval(refreshStatus, 2000);
setInterval(refreshEvents, 5000);
</script>
</body>
</html>
